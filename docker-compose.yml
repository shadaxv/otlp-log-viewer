services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_tracking
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - event-tracking-postgres:/var/lib/postgresql/data
      - ./apps/api/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_tracking"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  event-tracking-postgres:
